<div class="card">

  @if (imageUrl) {
    <img
      [src]="imageUrl"
      class="card-img-top"
      [alt]="title || 'Imagem do card'"
    />
  }

  <div class="card-body">

    @if (title) {
      <h5 class="card-title">{{ title }}</h5>
    }

    @if (description) {
      <p class="card-text">{{ description }}</p>
    }

    <a routerLink="/details" class="btn btn-primary">More Details</a>

  </div>
</div>
